name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        run: docker build -t cicd-python-app:latest .

  deploy:
    needs: test-and-build
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy application
        env:
          APP_ENV: ${{ secrets.DEPLOY_ENV }}
        run: ./deploy.sh

      - name: Verify container
        run: docker ps

      - name: Collect deployment logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker logs cicd-python-app > ci-logs/application.log 2>&1 || true
          docker inspect cicd-python-app > ci-logs/container-inspect.json 2>&1 || true

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: ci-logs/
